<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Last updated: 2025-10-20 v3 -->
    <title>Duck Surfers - Κατάταξη</title>
    <link rel="preconnect" href="self" />
    <link rel="preload" href="Assets/duck.png" as="image" />
    <link rel="stylesheet" href="styles.css?v=1759247265" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    
    <style>
      /* Leaderboard-specific styles */
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #135a8b 0%, #0d3f60 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        padding: 300px 20px 20px;
      }
      
      #leaderboard-container {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        padding: 0 15px;
      }
      
      /* Leaderboard-specific overrides */
      .outer-box {
        max-width: 450px;
        margin: 0 auto;
      }
      
      /* Remove yellow glow shadow - multiple methods */
      .shadow__outer,
      .outer-box .shadow__outer,
      .card .shadow__outer {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        background: none !important;
        filter: none !important;
      }
      
      .floating-ducks {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
      }
      
      .floating-duck {
        position: absolute;
        opacity: 0.4;
        animation: floatAndRotate 25s ease-in-out infinite;
        pointer-events: none;
      }
      
      .floating-duck:nth-child(1) { width: 50px; top: 5%; left: 10%; animation-delay: 0s; animation-duration: 28s; }
      .floating-duck:nth-child(2) { width: 45px; top: 15%; left: 80%; animation-delay: 3s; animation-duration: 25s; }
      .floating-duck:nth-child(3) { width: 55px; top: 30%; left: 5%; animation-delay: 6s; animation-duration: 30s; }
      .floating-duck:nth-child(4) { width: 48px; top: 45%; left: 85%; animation-delay: 9s; animation-duration: 27s; }
      .floating-duck:nth-child(5) { width: 52px; top: 60%; left: 15%; animation-delay: 2s; animation-duration: 26s; }
      .floating-duck:nth-child(6) { width: 46px; top: 75%; left: 75%; animation-delay: 5s; animation-duration: 29s; }
      .floating-duck:nth-child(7) { width: 54px; top: 85%; left: 20%; animation-delay: 8s; animation-duration: 24s; }
      .floating-duck:nth-child(8) { width: 49px; top: 20%; left: 50%; animation-delay: 4s; animation-duration: 31s; }
      .floating-duck:nth-child(9) { width: 51px; top: 50%; left: 45%; animation-delay: 7s; animation-duration: 23s; }
      .floating-duck:nth-child(10) { width: 47px; top: 70%; left: 60%; animation-delay: 1s; animation-duration: 28s; }
      
      @keyframes floatAndRotate {
        0%, 100% {
          transform: translate(0, 0) rotate(0deg);
        }
        25% {
          transform: translate(30px, -20px) rotate(90deg);
        }
        50% {
          transform: translate(-20px, 30px) rotate(180deg);
        }
        75% {
          transform: translate(20px, 10px) rotate(270deg);
        }
      }

      
      .loading-indicator {
        text-align: center;
        padding: 40px;
        color: #666;
      }
      
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #135a8b;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .hidden {
        display: none !important;
      }
      
      /* Responsive */
      @media (max-width: 768px) {
        body {
          align-items: flex-start;
          padding: 180px 5px 10px;
        }
        
        #leaderboard-container {
          max-width: 100%;
          padding: 0 8px;
        }
        
        .outer-box {
          max-width: 420px;
          padding: 25px 18px !important;
        }
        
        .floating-duck {
          opacity: 0.3;
        }
        
        .floating-duck:nth-child(1) { width: 35px; }
        .floating-duck:nth-child(2) { width: 32px; }
        .floating-duck:nth-child(3) { width: 38px; }
        .floating-duck:nth-child(4) { width: 34px; }
        .floating-duck:nth-child(5) { width: 36px; }
        .floating-duck:nth-child(6) { width: 33px; }
        .floating-duck:nth-child(7) { width: 37px; }
        .floating-duck:nth-child(8) { width: 35px; }
        .floating-duck:nth-child(9) { width: 36px; }
        .floating-duck:nth-child(10) { width: 34px; }
      }
    </style>
  </head>
  <body>
    <div id="leaderboard-container">
      <div class="card outer-box">
        <div class="floating-ducks">
          <img src="Assets/duck.png" class="floating-duck" alt="">
          <img src="Assets/duck.png" class="floating-duck" alt="">
          <img src="Assets/duck.png" class="floating-duck" alt="">
          <img src="Assets/duck.png" class="floating-duck" alt="">
          <img src="Assets/duck.png" class="floating-duck" alt="">
          <img src="Assets/duck.png" class="floating-duck" alt="">
          <img src="Assets/duck.png" class="floating-duck" alt="">
          <img src="Assets/duck.png" class="floating-duck" alt="">
          <img src="Assets/duck.png" class="floating-duck" alt="">
          <img src="Assets/duck.png" class="floating-duck" alt="">
        </div>
        <div class="shadow__outer" style="display: none !important;"></div>
        
        <div id="leaderboard-loading" class="loading-indicator">
          <div class="spinner"></div>
          <span>Φόρτωση κατάταξης...</span>
        </div>
        
        <!-- Podium για top 3 -->
        <div id="leaderboard-podium" class="podium hidden"></div>
        
        <!-- Λίστα για τους υπόλοιπους -->
        <ul id="leaderboard" class="hidden"></ul>
      </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="firebase-leaderboard.js"></script>
    <script>
      // Auto-load leaderboard on page load
      window.addEventListener('DOMContentLoaded', async () => {
        // Wait for Firebase to initialize
        await new Promise(resolve => setTimeout(resolve, 500));
        
        // Load leaderboard
        if (window.showLeaderboard) {
          await window.showLeaderboard(20);
        }
        
        // Auto-refresh every 30 seconds
        setInterval(async () => {
          if (window.showLeaderboard) {
            await window.showLeaderboard(20);
          }
        }, 30000);
      });
    </script>
  </body>
</html>
